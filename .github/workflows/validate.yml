name: validate

# Runs every repository check on Linux and Windows. The job name "validate" is the required
# status check context for main. Do not rename it: it passes only when every check job passes.
# This workflow does not tag, release or publish.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the old run of that pull request.
# A push to main is never cancelled: each commit on main gets a full run.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: dotnet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Locked mode (set in Directory.Build.props when CI=true) fails when a
      # lock file does not agree with the package references. NuGet audit
      # reports vulnerable packages; warnings are errors, so the restore fails.
      - name: Restore from the lock files and audit the packages
        run: dotnet restore

      - name: Build with warnings as errors
        run: dotnet build --configuration Release --no-restore

      - name: Check the format and the code style
        run: dotnet format --verify-no-changes --no-restore

      # The headless UI tests need no display. They save screenshots for review.
      - name: Run the tests
        run: dotnet test --configuration Release --no-build

      # Starts the real app, opens the window and exits with code 0. Linux needs a display server.
      - name: Launch smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dotnet src/Codepad.Desktop/bin/Release/net11.0/Codepad.Desktop.dll --smoke-test

      - name: Launch smoke test (Windows)
        if: runner.os == 'Windows'
        run: dotnet src/Codepad.Desktop/bin/Release/net11.0/Codepad.Desktop.dll --smoke-test

      - name: Upload the shell screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ runner.os }}
          path: tests/Codepad.Desktop.Tests/bin/Release/net11.0/screenshots/
          if-no-files-found: error
          retention-days: 14

  dkstack:
    name: dkstack checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-adrs compares the change with origin/main, so it needs the history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # dkstack format checks, copied from dkstack tag v1.6.0.
      # To update them, copy scripts/check-*.mjs again from a newer tag.
      - name: Check the format of the maps in docs/maps
        if: ${{ !cancelled() }}
        run: node scripts/check-maps.mjs

      - name: Check the format of CONTEXT.md
        if: ${{ !cancelled() }}
        run: node scripts/check-context.mjs

      - name: Check that new ADRs have Status and Affects
        if: ${{ !cancelled() }}
        run: node scripts/check-adrs.mjs

  validate:
    name: validate
    needs: [dotnet, dkstack]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every check job passed
        env:
          DOTNET_RESULT: ${{ needs.dotnet.result }}
          DKSTACK_RESULT: ${{ needs.dkstack.result }}
        run: |
          echo "dotnet: $DOTNET_RESULT, dkstack: $DKSTACK_RESULT"
          test "$DOTNET_RESULT" = "success" && test "$DKSTACK_RESULT" = "success"
